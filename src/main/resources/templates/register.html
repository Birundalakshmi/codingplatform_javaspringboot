<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — Coding Arena</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar">
    <div class="nav-container">
        <a href="/" class="nav-logo">
            <span class="logo-icon">⚡</span>
            <span class="logo-text">Coding Arena</span>
        </a>
        <div class="nav-links">
            <a href="/login" class="nav-link">Sign in</a>
        </div>
    </div>
</nav>
<main class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">⚡</div>
        <h2>Join the Arena</h2>
        <p class="auth-subtitle">Create your account and start solving problems</p>
        <form id="registerForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required autofocus>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" name="password" placeholder="Create a strong password" required>
            </div>
            <div class="form-group">
                <label>I am a</label>
                <select id="role" name="role">
                    <option value="STUDENT">🎓 Student</option>
                    <option value="MENTOR">👨‍💻 Mentor</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Create account →</button>
        </form>
        <p class="auth-link">Already have an account? <a href="/login">Sign in</a></p>
    </div>
</main>
<script src="/js/auth.js"></script>
</body>
</html>
