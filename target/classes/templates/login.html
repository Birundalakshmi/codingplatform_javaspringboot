<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Coding Arena</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar">
    <div class="nav-container">
        <a href="/" class="nav-logo">
            <span class="logo-icon">⚡</span>
            <span class="logo-text">Coding Arena</span>
        </a>
        <div class="nav-links">
            <a href="/register" class="nav-link">Create account</a>
        </div>
    </div>
</nav>
<main class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">⚡</div>
        <h2>Welcome back</h2>
        <p class="auth-subtitle">Sign in to your account to continue coding</p>
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-primary">Sign in →</button>
        </form>
        <p class="auth-link">Don't have an account? <a href="/register">Create one free</a></p>
    </div>
</main>
<script src="/js/auth.js"></script>
</body>
</html>
